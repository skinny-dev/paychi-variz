<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>پرداخت</title>
  <script src="/platform.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="paypage">
<div class="pay" id="root"><div class="card center muted">در حال بارگذاری…</div></div>
<script>
  const root = document.getElementById('root');
  const slug = location.pathname.split('/').filter(Boolean).pop();
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fa = (n) => Number(n).toLocaleString('fa-IR');
  const toEn = (s) => String(s ?? '').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const digits = (s) => toEn(s).replace(/\D/g, '');

  function fail(text) {
    root.innerHTML = `<div class="card center"><div class="state expired">!</div><h2>${esc(text)}</h2></div>`;
  }

  async function load() {
    const res = await fetch('/api/pay/link/' + encodeURIComponent(slug), { cache: 'no-store' });
    const link = await res.json().catch(() => ({}));
    if (!res.ok) return fail(link.error?.message || 'لینک پرداخت پیدا نشد');
    document.title = link.title + ' — ' + link.merchant_name;
    if (!link.active) return fail('این لینک پرداخت غیرفعال است');
    const range = link.max_amount
      ? `بین ${fa(link.min_amount)} تا ${fa(link.max_amount)} ریال`
      : `حداقل ${fa(link.min_amount)} ریال`;
    root.innerHTML = `
      <div class="card">
        <div class="center">
          <div class="muted small">${esc(link.merchant_name)}</div>
          <h2 style="margin:6px 0">${esc(link.title)}</h2>
          ${link.description ? `<p class="muted small" style="white-space:pre-wrap">${esc(link.description)}</p>` : ''}
          ${link.amount ? `<div class="amount">${fa(link.amount)} <small>ریال</small></div>
            <div class="muted small">معادل ${fa(Math.floor(link.amount / 10))} تومان</div>` : ''}
        </div>
        <form id="f" style="margin-top:16px">
          ${link.amount ? '' : `<div class="field"><label>مبلغ (ریال) — ${range}</label>
            <input name="amount" class="ltr" inputmode="numeric" required autocomplete="off"></div>
            <div class="small muted" id="toman" style="margin:-6px 0 10px"></div>`}
          ${link.ask_payer ? `<div class="field"><label>نام و نام خانوادگی</label><input name="payer_name" required autocomplete="name"></div>
            <div class="field"><label>شماره تماس</label><input name="payer_phone" class="ltr" inputmode="tel" required autocomplete="tel"></div>` : ''}
          <p id="err" class="note" style="background:var(--error-container);color:var(--on-error-container)" hidden></p>
          <button class="btn block" id="go">ادامه و دریافت شماره کارت</button>
        </form>
        <p class="small muted center" style="margin-top:12px">پرداخت کارت به کارت — پس از واریز، تأیید خودکار انجام می‌شود.</p>
      </div>`;
    const f = document.getElementById('f');
    const amountInput = f.elements.amount;
    if (amountInput) {
      amountInput.addEventListener('input', () => {
        const n = digits(amountInput.value);
        amountInput.value = n ? Number(n).toLocaleString('en-US') : '';
        document.getElementById('toman').textContent = n ? `${fa(n)} ریال = ${fa(Math.floor(n / 10))} تومان` : '';
      });
    }
    f.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('go');
      const err = document.getElementById('err');
      btn.disabled = true;
      err.hidden = true;
      try {
        const body = {
          amount: amountInput ? Number(digits(amountInput.value)) : undefined,
          payer_name: f.elements.payer_name?.value,
          payer_phone: f.elements.payer_phone ? digits(f.elements.payer_phone.value) : undefined,
        };
        const r = await fetch('/api/pay/link/' + encodeURIComponent(slug), {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error?.message || 'خطا، دوباره تلاش کنید');
        location.href = j.payment_url;
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
      }
    };
  }
  load().catch(() => fail('خطا در بارگذاری'));
</script>
</body>
</html>
